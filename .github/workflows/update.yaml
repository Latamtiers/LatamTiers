name: Update LatamTiers data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# CLAVE: cancel-in-progress: true cancela ejecuciones viejas
# cuando una nueva entra al mismo grupo.
concurrency:
  group: latamtiers-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tracker
        run: python track_history.py

      - name: Commit & push si hay cambios (con reintentos)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Solo agrega si existen
          [ -f history.json ] && git add history.json
          [ -f ranking.json ] && git add ranking.json

          if git diff --staged --quiet; then
            echo "💤 Sin cambios que commitear"
            exit 0
          fi

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "chore(data): update ranking & history [${TIMESTAMP}]"

          # Bucle de reintentos: si el push falla, rebasea y reintenta
          MAX_ATTEMPTS=5
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "🔁 Intento de push #$ATTEMPT de $MAX_ATTEMPTS"
            if git push origin main 2>/dev/null; then
              echo "✅ Push exitoso"
              exit 0
            fi
            echo "⚠️  Push rechazado, rebaseando sobre origin/main…"
            git pull --rebase origin main || {
              echo "❌ Rebase falló, abortando"
              git rebase --abort || true
              exit 1
            }
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "❌ No se pudo pushear después de $MAX_ATTEMPTS intentos"
          exit 1