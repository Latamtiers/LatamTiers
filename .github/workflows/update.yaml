name: Update LatamTiers data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latamtiers-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Importante: trae el historial completo para poder rebasear
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tracker
        run: python track_history.py
        continue-on-error: true

      - name: Commit & push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json ranking.json

          if git diff --staged --quiet; then
            echo "💤 Sin cambios que commitear"
            exit 0
          fi

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "chore(data): update ranking & history [${TIMESTAMP}]"

          # Rebase para integrar commits que hayan llegado mientras corríamos
          git pull --rebase origin main || {
            echo "⚠️  Rebase falló, abortando y reintentando en el próximo ciclo"
            git rebase --abort || true
            exit 1
          }

          git push origin main
          echo "✅ Cambios subidos"